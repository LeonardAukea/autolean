version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Stockholm
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: Python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Stockholm
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: CI

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 2
    commit-message:
      prefix: Nix
