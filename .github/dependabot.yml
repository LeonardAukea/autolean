version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Stockholm
    groups:
      python:
        patterns: ["*"]
    # The build backend's version is chosen by nixpkgs, which supplies it to
    # the Nix build. A bump here compiles nowhere until nixpkgs carries the
    # same version, so the pin follows nixpkgs rather than the registry.
    ignore:
      - dependency-name: hatchling
    open-pull-requests-limit: 2
    commit-message:
      prefix: Python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Stockholm
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: CI

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 2
    commit-message:
      prefix: Nix
