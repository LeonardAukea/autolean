[project]
name = "autolean"
version = "0.5.0"
description = "Autonomous Lean 4 proof agent — overnight sorry elimination, autoformalization, and proof golf. Inspired by Karpathy's autoresearch and RightNow-AI's autokernel."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AutoLean Contributors" }]
keywords = ["lean4", "theorem-proving", "ai", "autonomous-agent", "formal-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["ruff", "pytest", "respx", "mypy"]
all = ["pymupdf>=1.24"]

[project.scripts]
autolean = "autolean.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run lake build (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
