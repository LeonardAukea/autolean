base_model: google/gemma-4-E2B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
load_in_4bit: true
adapter: qlora
lora_r: 64
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
datasets:
- path: training_data/sft.jsonl
  type: sharegpt
  conversation: chatml
sequence_len: 8192
micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 3
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.1
optimizer: adamw_8bit
bf16: true
gradient_checkpointing: true
output_dir: /Users/leonardaukea/Src/autolean/workspace/training_data/output
logging_steps: 10
save_strategy: epoch
wandb_project: autolean-finetune
